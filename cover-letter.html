<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warren Gill - Cover Letter Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link id="bootstrapTheme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/litera/bootstrap.min.css">
    <script src="theme.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top py-1">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Warren Gill</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#siteNavigation" aria-controls="siteNavigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="siteNavigation">
                <div class="navbar-nav ms-auto">
                    <a href="index.html" class="nav-link">Home</a>
                    <a href="resume.html" class="nav-link">Résumé</a>
                    <a href="cover-letter.html" class="nav-link active" aria-current="page">Cover Letter</a>
                    <div class="dropdown ms-lg-3">
                        <button class="btn btn-sm btn-outline-info dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Choose color theme">☀</button>
                        <ul class="dropdown-menu dropdown-menu-end" role="menu">
                            <li><button class="dropdown-item theme-option" type="button" data-theme-preference="light" role="menuitemradio" aria-checked="false">Light</button></li>
                            <li><button class="dropdown-item theme-option" type="button" data-theme-preference="dark" role="menuitemradio" aria-checked="false">Dark</button></li>
                            <li><button class="dropdown-item theme-option" type="button" data-theme-preference="auto" role="menuitemradio" aria-checked="false">Auto</button></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    
    <main class="container py-5">
        <div class="row g-4 align-items-start">
            <section class="col-lg-5">
                <div class="card h-100">
                    <div class="card-body p-4">
                        <img src="wg-selfie.png" alt="Warren Gill" class="rounded-circle mb-4" width="96" height="96">
                        <h1 class="h2">Cover Letter Generator</h1>
                        <p class="text-body-secondary mb-4">Fill in the details to generate a customized cover letter</p>
            
                        <form id="coverLetterForm">
                            <div class="mb-3">
                                <label for="hiringManager" class="form-label">Hiring Manager Name</label>
                                <input type="text" id="hiringManager" class="form-control" placeholder="e.g., Jane Smith">
                            </div>
                            
                            <div class="mb-3">
                                <label for="companyName" class="form-label">Company Name</label>
                                <input type="text" id="companyName" class="form-control" placeholder="e.g., Tech Innovations Inc." required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="positionTitle" class="form-label">Position Title</label>
                                <input type="text" id="positionTitle" class="form-control" placeholder="e.g., Senior Technical Writer" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="yearsExperience" class="form-label">Years of Experience</label>
                                <input type="number" id="yearsExperience" class="form-control" value="15" min="1" max="50">
                            </div>
                            
                            <div class="mb-3">
                                <label for="customValue" class="form-label">Custom Value Proposition <span class="text-body-secondary">(Optional)</span></label>
                                <textarea id="customValue" class="form-control" rows="4" placeholder="Add specific details about how your experience addresses this company's needs..."></textarea>
                            </div>
                            
                            <div class="mb-4">
                                <label for="narrativeStyle" class="form-label">Narrative Style</label>
                                <select id="narrativeStyle" class="form-select">
                                    <option value="standard">Standard Professional</option>
                                    <option value="innovation">Innovation-Focused</option>
                                    <option value="technical">Technical Depth</option>
                                    <option value="collaboration">Collaboration-Focused</option>
                                    <option value="impact">Impact-Driven</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">Generate Cover Letter</button>
                        </form>
                    </div>
                </div>
            </section>
            
            <section class="col-lg-7 sticky-lg-top" style="top: 1rem;">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center gap-3 flex-wrap">
                        <h2 class="h4 mb-0">Preview</h2>
                        <div class="d-flex gap-2 flex-wrap">
                            <button id="openModalBtn" class="btn btn-outline-info d-none" type="button" data-bs-toggle="modal" data-bs-target="#letterModal">Open Full Preview</button>
                            <button id="copyBtn" class="btn btn-outline-light d-none" type="button">Copy to Clipboard</button>
                        </div>
                    </div>
                    <div id="letterPreview" class="card-body bg-light text-dark min-vh-50">
                        <p class="text-body-secondary text-center py-5 mb-0">Fill out the form to generate your cover letter</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="letterModal" tabindex="-1" aria-labelledby="letterModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="letterModalLabel">Cover Letter Preview</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div id="modalLetterPreview" class="modal-body bg-light text-dark"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="cover-letter.js"></script>
</body>
</html>
